const ph=(h,l,src)=>src?`<div class="ph" role="img" aria-label="${esc(l)}"><img src="${src}" alt="${esc(l)}" loading="lazy"></div>`:`<div class="ph" style="--h:${h}" role="img" aria-label="${esc(l)}"><span>${esc(l)}</span></div>`;
const st={s:{hotel:HOTELS[0],cin:addD(T0,1),cout:addD(T0,3),adults:2,children:0,rooms:1},sel:null,offer:null,step:1,g:{},errs:{},last:null,admin:false,f:{type:'',price:'',am:'',sort:'rec'},bf:{q:'',st:'',ty:''},menu:false};
const badge=s=>`<span class="b ${esc(s)}">${esc(s)}</span>`;
const go=h=>{if(location.hash===h)R();else location.hash=h;};
function searchPanel(pull){const s=st.s;return`<form class="panel ${pull?'pull':''}" id="search" onsubmit="return A.search(event)" aria-label="Booking search"><div><label for="hs">Destination or Hotel</label><select id="hs">${HOTELS.map(h=>`<option ${s.hotel===h?'selected':''}>${h}</option>`).join('')}</select></div><div><label for="cin">Check-in</label><input id="cin" type="date" min="${T0}" value="${s.cin}"></div><div><label for="cout">Check-out</label><input id="cout" type="date" min="${addD(T0,1)}" value="${s.cout}"></div><div><label for="ad">Adults</label><input id="ad" type="number" min="1" max="12" value="${s.adults}"></div><div><label for="ch">Children</label><input id="ch" type="number" min="0" max="8" value="${s.children}"></div><div><label for="rm">Rooms</label><input id="rm" type="number" min="1" max="6" value="${s.rooms}"></div><button class="btn n">Search Availability</button><div id="serr" class="err" role="alert"></div></form>`}
function pricing(t,offerPct){const s=st.s;return calc(t,s.cin,s.cout,s.rooms,offerPct??(st.offer?.pct||0))}
function roomCard(t){const s=st.s,c=pricing(t),av=freeRooms(t.id,s.cin,s.cout).length,ok=av>=s.rooms&&fits(t,s);return`<article class="card">${ph(t.hue,t.name,IMG[t.id]||IMG.list[0])}<div class="pad"><h3><a href="#/rooms/${t.id}">${t.name}</a></h3><p class="mut">${t.desc}</p><p class="mut">${t.bed} · ${t.size} · Up to ${t.ma} adults, ${t.mc} children</p><div class="chips">${t.am.map(a=>`<span class="chip">${a}</span>`).join('')}</div><div class="row"><span>${inr(t.price)} / night</span><span>${c.nights} night${c.nights>1?'s':''}</span></div><div class="row"><span>Taxes (${CFG.tax}%)</span><span>${inr(c.tax)}</span></div><div class="row t"><span>Total</span><span class="price">${inr(c.total)}</span></div><p class="mut">${av} room${av!==1?'s':''} available${!fits(t,s)?' · Guests exceed capacity':''}</p><button class="btn" ${ok?'':'disabled'} onclick="A.pick('${t.id}')">Select Room</button> <a class="btn o" target="_blank" rel="noopener" href="${wa('Hello Hotel Serenity Inn, I would like to book the '+t.name+' from '+fd(s.cin)+' to '+fd(s.cout)+' for '+s.adults+' adults, '+s.children+' children, '+s.rooms+' room(s).')}">Book via WhatsApp</a></div></article>`}
function summary(t,c,extra=''){const s=st.s;return`<aside class="card pad stick"><h3>${CFG.name}</h3>${t?`<div class="row"><span>Room</span><span>${t.name}</span></div>`:''}<div class="row"><span>Check-in</span><span>${fd(s.cin)}</span></div><div class="row"><span>Check-out</span><span>${fd(s.cout)}</span></div><div class="row"><span>Nights</span><span>${c.nights}</span></div><div class="row"><span>Guests</span><span>${s.adults} adults, ${s.children} children</span></div><div class="row"><span>Rooms</span><span>${s.rooms}</span></div><div class="row"><span>Room price</span><span>${inr(c.sub)}</span></div><div class="row"><span>Discount${st.offer?' ('+esc(st.offer.n)+')':''}</span><span>−${inr(c.disc)}</span></div><div class="row"><span>Taxes</span><span>${inr(c.tax)}</span></div><div class="row t"><span>Grand total</span><span>${inr(c.total)}</span></div>${extra}</aside>`}
/* ========== PUBLIC VIEWS ========== */
const V={};
V.home=()=>`<section class="hero" style="background-image:linear-gradient(rgba(20,33,61,.74),rgba(20,33,61,.74)),url(${IMG.front});background-size:cover;background-position:center 40%"><div class="w"><h1>Stay Comfortable at Hotel Serenity Inn, Mysore</h1><p>Comfortable rooms, convenient facilities, and a relaxing stay in Mysore.</p><a class="btn" href="#/rooms">Book Your Stay</a> <a class="btn o" style="color:#fff;border-color:#fff" href="#search" onclick="document.getElementById('search').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('cin').focus();return false">Search Availability</a> <a class="btn" style="background:#25D366;border-color:#25D366" target="_blank" rel="noopener" href="${wa('Hello Hotel Serenity Inn, I would like to check room availability.')}">Chat on WhatsApp</a></div></section><div class="w">${searchPanel(1)}</div><section class="sec w"><h2>Rooms in Mysore for every kind of stay</h2><div class="grid">${TYPES.slice(0,3).map(t=>`<article class="card">${ph(t.hue,t.name,IMG[t.id]||IMG.list[0])}<div class="pad"><h3>${t.name}</h3><p class="mut">${t.desc}</p><p class="price">From ${inr(t.price)}</p><a class="btn o" href="#/rooms/${t.id}">View room</a></div></article>`).join('')}</div></section>`;
V.rooms=()=>{const f=st.f;let l=TYPES.filter(t=>t.active&&(!f.type||t.id===f.type)&&(!f.price||t.price<=+f.price)&&(!f.am||t.am.includes(f.am)));if(f.sort==='lo')l.sort((a,b)=>a.price-b.price);if(f.sort==='hi')l.sort((a,b)=>b.price-a.price);const ams=[...new Set(TYPES.flatMap(t=>t.am))];const o=(v,c)=>`<option value="${v}" ${f[c]==v?'selected':''}>`;
return`<div class="w sec"><h1>Rooms in Mysore</h1>${st.offer?`<p class="note">Offer applied: ${esc(st.offer.n)} (${st.offer.pct}% off). <a href="#" onclick="st.offer=null;R();return false">Remove</a></p>`:''}${searchPanel()}<div class="filters" style="margin-top:16px"><select aria-label="Room type" onchange="st.f.type=this.value;R()">${o('','type')}All room types</option>${TYPES.map(t=>o(t.id,'type')+t.name+'</option>').join('')}</select><select aria-label="Max price" onchange="st.f.price=this.value;R()">${o('','price')}Any price</option>${[3000,4000,5000,8000].map(p=>o(p,'price')+'Up to '+inr(p)+'</option>').join('')}</select><select aria-label="Amenities" onchange="st.f.am=this.value;R()">${o('','am')}Any amenity</option>${ams.map(a=>o(a,'am')+a+'</option>').join('')}</select><select aria-label="Sort" onchange="st.f.sort=this.value;R()">${o('rec','sort')}Recommended</option>${o('lo','sort')}Price Low to High</option>${o('hi','sort')}Price High to Low</option></select></div><p class="mut">${st.s.adults} adults, ${st.s.children} children, ${st.s.rooms} room(s) · ${fd(st.s.cin)} to ${fd(st.s.cout)}</p><div class="grid">${l.map(roomCard).join('')||`<div><p>No rooms are available for the selected dates or filters. Try changing your dates or clearing a filter.</p><a class="btn" target="_blank" rel="noopener" href="${wa('Hello Hotel Serenity Inn, I would like to check room availability from '+fd(st.s.cin)+' to '+fd(st.s.cout)+'.')}">WhatsApp for Availability</a></div>`}</div></div>`};
V.room=id=>{const t=typeOf(id);if(!t)return'<div class="w sec"><h1>Room not found</h1></div>';const c=pricing(t),av=freeRooms(t.id,st.s.cin,st.s.cout).length;return`<div class="w sec"><p class="mut"><a href="#/">Home</a> / <a href="#/rooms">Rooms</a> / ${t.name}</p><div class="two"><div><div class="grid" style="grid-template-columns:2fr 1fr">${ph(t.hue,t.name+' – main view',IMG[t.id]||IMG.list[0])}<div style="display:grid;gap:12px">${ph(t.hue+20,'Room view',IMG.list[(TYPES.indexOf(t)+1)%4])}${ph(t.hue-20,'Room view',IMG.list[(TYPES.indexOf(t)+2)%4])}</div></div><h1 style="margin-top:20px">${t.name}</h1><p>${t.desc}</p><div class="row"><span>Room size</span><span>${t.size}</span></div><div class="row"><span>Bed</span><span>${t.bed}</span></div><div class="row"><span>Max occupancy</span><span>${t.ma} adults, ${t.mc} children</span></div><div class="row"><span>Inventory</span><span>${t.total} rooms · ${av} available for your dates</span></div><h3 style="margin-top:20px">Amenities</h3><div class="chips">${t.am.map(a=>`<span class="chip">${a}</span>`).join('')}</div><h3>Policies</h3><p class="mut">Check-in ${CFG.cin}. Check-out ${CFG.cout}. ${CFG.policy}</p></div><div>${summary(t,c,`<button class="btn" style="width:100%;margin-top:12px" ${av>=st.s.rooms&&fits(t,st.s)?'':'disabled'} onclick="A.pick('${t.id}')">Book Your Stay</button>`)}</div></div></div>`};
function form(){const g=st.g,e=st.errs,f=(k,l,ty='text',req=1)=>`<div><label for="g_${k}">${l}${req?' *':''}</label><input id="g_${k}" type="${ty}" value="${esc(g[k])}" ${req?'required':''}><span class="fe">${e[k]||''}</span></div>`;return`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${f('fn','First Name')}${f('ln','Last Name')}${f('em','Email','email')}${f('mo','Mobile Number','tel')}${f('wa','WhatsApp Number','tel',0)}${f('co','Country','text',0)}${f('ci','City','text',0)}</div><label for="g_rq" style="margin-top:12px">Special Requests</label><textarea id="g_rq" rows="3">${esc(g.rq)}</textarea>`}

A_['room-types']=()=>adm('room-types',`<div class="ah"><h2>Room types</h2></div>${tbl(['Type','Price','Weekend','Max occupancy','Rooms','Free today','Status','Actions'],TYPES.map(t=>`<tr><td>${t.name}</td><td><input type="number" style="width:90px" aria-label="Price ${t.name}" value="${t.price}" onchange="A.tp('${t.id}','price',this.value)"></td><td><input type="number" style="width:90px" aria-label="Weekend price ${t.name}" value="${t.wk}" onchange="A.tp('${t.id}','wk',this.value)"></td><td>${t.ma}+${t.mc}</td><td>${ROOMS.filter(r=>r.type===t.id).length}</td><td>${freeRooms(t.id,T0,addD(T0,1)).length}</td><td>${badge(t.active?'Active':'Inactive')}</td><td><button class="btn s o" onclick="A.tt('${t.id}')">${t.active?'Deactivate':'Activate'}</button> <button class="btn s o" onclick="A.td('${t.id}')">Delete</button></td></tr>`).join(''))}<h3 style="margin-top:16px">Add room type</h3><form class="panel" onsubmit="return A.ta(event)"><div><label for="tn">Name</label><input id="tn" required></div><div><label for="tp">Price</label><input id="tp" type="number" min="1" required></div><div><label for="tw">Weekend price</label><input id="tw" type="number" min="1"></div><div><label for="tA">Max adults</label><input id="tA" type="number" min="1" value="2"></div><div><label for="tC">Max children</label><input id="tC" type="number" min="0" value="1"></div><div><label for="tq">Rooms</label><input id="tq" type="number" min="1" value="2"></div><button class="btn">Add type</button></form>`);

Object.assign(A,{
io(id,s){const b=BK.find(x=>x.id===id);b.status=s;if(s==='Checked-out')b.rn.forEach(n=>ROOMS.find(r=>r.no===n).hk='Dirty');R()},
